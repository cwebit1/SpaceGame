<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceGame - Mini</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        header h1 {
            color: #00d4ff;
            font-size: 2rem;
        }

        header p {
            color: #888;
            margin-top: 5px;
        }

        /* Sections */
        section {
            display: none;
        }

        section:not([hidden]) {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Forms */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            background: #252545;
            border: 1px solid #444;
            border-radius: 6px;
            color: #eaeaea;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #1a1a2e;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: #333;
            color: #eaeaea;
            border: 1px solid #555;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #444;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
        }

        /* Cards */
        .card {
            background: #252545;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .game-card,
        .body-card {
            background: #252545;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.2s ease;
        }

        .game-card:hover,
        .body-card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .game-card h3,
        .body-card h3 {
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .game-card p,
        .body-card p {
            color: #aaa;
            margin-bottom: 8px;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 40px;
            font-style: italic;
        }

        .error {
            background: #3d1a1a;
            border: 1px solid #ff4444;
            color: #ff6666;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        /* Tables */
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .table th,
        .table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .table th {
            color: #00d4ff;
            font-weight: 600;
        }

        .table tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        /* Status badges */
        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-waiting { background: #333; color: #aaa; }
        .status-running { background: #1a5c1a; color: #44ff44; }
        .status-done { background: #1a3c5c; color: #44aaff; }
        .status-paused { background: #5c4a1a; color: #ffaa44; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: #1a1a3e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #888;
        }

        /* Resources */
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .resource {
            background: #1a1a3e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .resource-icon {
            font-size: 1.5rem;
        }

        .resource-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #eaeaea;
        }

        .resource-label {
            font-size: 0.8rem;
            color: #888;
        }

        .resource-rate {
            font-size: 0.8rem;
            color: #44ff44;
        }

        /* Energy */
        .energy-bar {
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #ffdd00);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* Section headers with back button */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .section-header h2 {
            color: #00d4ff;
        }

        /* Login specific */
        #login-section {
            max-width: 400px;
            margin: 50px auto;
        }

        #login-section .card {
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .resources-grid,
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .table {
                font-size: 0.8rem;
            }

            .table th,
            .table td {
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SpaceGame</h1>
            <p>Mini Frontend - Task 8b</p>
        </header>

        <!-- Login Section -->
        <section id="login-section">
            <div class="card">
                <h2>Login</h2>
                <div id="login-error" class="error" hidden></div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Accedi</button>
                </form>
            </div>
        </section>

        <!-- Games Section -->
        <section id="games-section" hidden>
            <div class="section-header">
                <h2>Le tue Partite</h2>
            </div>
            <div id="games-error" class="error" hidden></div>
            <div id="games-list"></div>
        </section>

        <!-- Bodies Section -->
        <section id="bodies-section" hidden>
            <div class="section-header">
                <h2 id="bodies-game-name">Pianeti</h2>
            </div>
            <div id="bodies-error" class="error" hidden></div>
            <div id="bodies-list"></div>
        </section>

        <!-- Detail Section -->
        <section id="detail-section" hidden>
            <div class="section-header">
                <button id="detail-back-btn" class="btn btn-secondary">← Indietro</button>
                <h2 id="detail-body-name">Dettaglio Pianeta</h2>
                <span id="detail-body-coords" style="color: #888;"></span>
            </div>
            <div id="detail-error" class="error" hidden></div>

            <!-- Fields -->
            <div class="card">
                <h3>🏗️ Campi</h3>
                <div class="stats-grid" id="detail-fields"></div>
            </div>

            <!-- Resources -->
            <div class="card">
                <h3>📦 Risorse</h3>
                <div class="resources-grid" id="detail-resources"></div>
            </div>

            <!-- Energy -->
            <div class="card">
                <h3>⚡ Energia</h3>
                <div id="detail-energy"></div>
            </div>

            <!-- Buildings -->
            <div class="card">
                <h3>🏢 Edifici Costruiti</h3>
                <div id="detail-buildings"></div>
            </div>

            <!-- Build Queue -->
            <div class="card">
                <h3>🔨 Coda Costruzione</h3>
                <div id="detail-build-queue"></div>
            </div>

            <!-- Research Queue -->
            <div class="card">
                <h3>🔬 Coda Ricerca</h3>
                <div id="detail-research-queue"></div>
            </div>

            <!-- Buildable -->
            <div class="card">
                <h3>📋 Edifici Costruibili</h3>
                <div id="detail-buildable"></div>
            </div>

            <!-- Researchable -->
            <div class="card">
                <h3>📚 Ricerche Disponibili</h3>
                <div id="detail-researchable"></div>
            </div>
        </section>
    </div>

    <script src="js/mini.js"></script>
</body>
</html>
